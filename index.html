function btn(t,fn,on,st){const b=document.createElement('button');b.textContent=t;if(on)b.className='on';b.onmouseenter=()=>snd(900,.03,'sine',.015);b.onclick=()=>{snd(600,.06,'square',.03);if(MU&&!mus)music(1);fn()};if(st)b.style.cssText=st;return b}
function row(arr){const d=document.createElement('div');d.className='row';arr.forEach(b=>d.appendChild(b));return d}
function mk(tag,html){const e=document.createElement(tag);if(html!=null)e.innerHTML=html;return e}
const PF={};function portrait(i){const cv=document.createElement('canvas');cv.width=cv.height=52;if(!cv.getContext)return cv;const f=PF[i]||(PF[i]=new F(i,0,1,0)),old=X;X=cv.getContext('2d');X.clearRect(0,0,52,52);face(f,26,26,23);X=old;return cv}
let MG=null;
function menuBg(){const key=cfg.p1+'|'+cfg.p2+'|'+cfg.mode+'|'+cfg.cmp;if(!MG||MG.key!==key){const pb=(cfg.mode==='versus'||cfg.cmp)?cfg.p2:(cfg.p1+3)%CH.length;MG={tick:MG?MG.tick:0,pr:[],time:99,over:0,key};G=MG;try{MG.a=new F(cfg.p1,560,1,0);MG.b=new F(pb,800,-1,0)}finally{G=null}}
G=MG;try{MG.tick++;const a=MG.a,b=MG.b;a.fm=Math.min(cfg.sf|0,a.c.fm.length-1);a.face=1;b.face=-1;bg();body(a);body(b);const g=X.createLinearGradient(0,0,W,0);g.addColorStop(0,'rgba(0,0,10,.75)');g.addColorStop(.6,'rgba(0,0,10,.15)');g.addColorStop(1,'rgba(0,0,10,.4)');X.fillStyle=g;X.fillRect(0,0,W,540)}finally{G=null}}
function menu(){dlgNext=null;M.style.display='flex';M.style.background='';M.innerHTML='<h1 style="align-self:flex-start;margin-left:6%">FUSION ARENA</h1><small style="align-self:flex-start;margin-left:6%">Niv. '+lvl()+' \u00b7 XP '+sv.xp+' \u00b7 '+sv.w+' victoires</small>';const col=mk('div');col.style.cssText='display:flex;flex-direction:column;align-self:flex-start;margin-left:6%;gap:3px;min-width:270px';
[['\u2605 MODE HISTOIRE',()=>storyMenu()],['ARCADE',()=>selectScreen('arcade')],['VERSUS LOCAL',()=>selectScreen('versus')],['ENTRA\u00ceNEMENT',()=>selectScreen('train')],['SURVIE',()=>selectScreen('survie')],['PERSONNAGES',()=>selectScreen(cfg.mode)],['COLLECTION',collMenu],['STATISTIQUES',statMenu],['PARAM\u00c8TRES',settingsMenu]].forEach((x,i)=>col.appendChild(btn(x[0],x[1],0,'text-align:left;font-size:17px;padding:9px 18px;animation-delay:'+i*.04+'s')));M.appendChild(col)}
function settingsMenu(){dlgNext=null;M.style.display='flex';M.style.background='';M.innerHTML='<h1>PARAM\u00c8TRES</h1>';M.appendChild(row([btn('Effets r\u00e9duits : '+(LOW?'OUI':'NON'),()=>{LOW=!LOW;try{localStorage.setItem('falow',LOW?'1':'0')}catch(e){}settingsMenu()}),btn('Musique : '+(MU?'OUI':'NON'),()=>{MU=!MU;try{localStorage.setItem('famu',MU?'1':'0')}catch(e){}music(MU);settingsMenu()}),btn('\u2328 COMMANDES',()=>ctlMenu())]));M.appendChild(btn('\u2190 Retour',menu))}
function selectScreen(mode){if(mode&&mode!==cfg.mode){cfg.mode=mode;cfg.sel2=false}if(cfg.mode==='story')cfg.mode='arcade';dlgNext=null;M.style.display='flex';M.style.background='';const m=cfg.mode,T={arcade:'ARCADE',versus:'VERSUS LOCAL',train:'ENTRA\u00ceNEMENT',survie:'SURVIE'};M.innerHTML='<h1>'+(T[m]||'PERSONNAGES')+'</h1>';
const wrap=mk('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:96%;align-items:flex-start';
const left=mk('div');left.style.cssText='display:flex;flex-wrap:wrap;gap:5px;max-width:340px;justify-content:center';
CH.forEach((c,i)=>{const b=document.createElement('button');b.style.cssText='padding:2px;width:62px;height:80px;font-size:10px;line-height:1.1;'+(cfg.p1===i?'outline:3px solid #0cf;':'')+((m==='versus'||cfg.cmp)&&cfg.p2===i?'outline:3px solid #fa4;':'');b.appendChild(portrait(i));b.appendChild(document.createElement('br'));b.appendChild(document.createTextNode(c.n));b.onmouseenter=()=>snd(900,.03,'sine',.015);b.onclick=()=>{snd(600,.06,'square',.03);if((m==='versus'||cfg.cmp)&&cfg.sel2)cfg.p2=i;else cfg.p1=i;cfg.sf=0;selectScreen()};left.appendChild(b)});
const right=mk('div');right.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:300px;max-width:540px';
if(m==='versus'||cfg.cmp)right.appendChild(row([btn('Choix : Joueur 1',()=>{cfg.sel2=false;selectScreen()},!cfg.sel2),btn('Choix : '+(m==='versus'?'Joueur 2':'Adversaire'),()=>{cfg.sel2=true;selectScreen()},!!cfg.sel2)]));
right.appendChild(statPanel());
right.appendChild(row(AR.map((a,i)=>btn(a[0],()=>{cfg.ar=i;selectScreen()},cfg.ar===i,'background:linear-gradient(135deg,'+a[1][0]+','+a[1][1]+');color:#fff;text-shadow:0 0 4px #000;min-width:96px;height:40px;font-size:12px'+(cfg.ar===i?';outline:3px solid #fff':'')))));
if(m!=='versus'&&m!=='train')right.appendChild(row(['Facile','Normal','Difficile'].map((n,i)=>btn(n,()=>{cfg.diff=i;selectScreen()},cfg.diff===i))));
right.appendChild(btn('\u25b6 COMBATTRE',()=>{stage=0;if(m==='arcade'||m==='survie')cfg.p2=(cfg.p1+1)%CH.length;start()},0,'font-size:20px;padding:10px 30px'));
wrap.appendChild(left);wrap.appendChild(right);M.appendChild(wrap);M.appendChild(btn('\u2190 Retour',menu))}

menu();requestAnimationFrame(loop);
</script></body></html>
