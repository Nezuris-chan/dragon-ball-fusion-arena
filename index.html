function exportPlayerSave(){try{const pack={format:'FusionArenaSave',version:2,fa:sv,fakm:localStorage.getItem('fakm')||null,falow:localStorage.getItem('falow')||'0',famu:localStorage.getItem('famu')||'1'};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fusion-arena-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);alert('Sauvegarde exportée. Garde ce fichier en lieu sûr.')}catch(e){alert('Export impossible sur ce navigateur.')}}
function importPlayerSave(file){const r=new FileReader();r.onload=()=>{try{const pack=JSON.parse(r.result);if(!pack||pack.format!=='FusionArenaSave'||!pack.fa)throw new Error('Fichier invalide');const old=localStorage.getItem('fa');if(old)localStorage.setItem('fa_backup',old);sv=Object.assign({xp:0,w:0,l:0},pack.fa);localStorage.setItem('fa',JSON.stringify(sv));if(pack.fakm)localStorage.setItem('fakm',pack.fakm);if(pack.falow!=null)localStorage.setItem('falow',pack.falow);if(pack.famu!=null)localStorage.setItem('famu',pack.famu);alert('Sauvegarde importée. Recharge le jeu pour appliquer toutes les données.');settingsMenu()}catch(e){alert('Sauvegarde invalide ou illisible. Aucune donnée importée.')}};r.readAsText(file)}
async function setPlayerPseudo(){const value=prompt('Choisis ton pseudo public (2 à 16 caractères) :',sv.pseudo||'Joueur');if(value===null)return;const name=value.replace(/[\u0000-\u001f\u007f]/g,'').trim().slice(0,16);if(name.length<2){alert('Le pseudo doit contenir au moins 2 caractères.');return}sv.pseudo=name;save();if(onlineUser&&sbClient){const {error}=await sbClient.from('profiles').update({username:name,xp:Math.max(0,Number(sv.xp)||0),player_level:lvl()}).eq('id',onlineUser.id);if(error){alert('Pseudo enregistré localement, mais mise à jour du classement impossible : '+error.message);settingsMenu();return}}settingsMenu()}
function settingsMenu(){dlgNext=null;M.style.display='flex';M.style.background='';M.innerHTML='<h1>PARAMÈTRES</h1>';M.appendChild(row([btn('PSEUDO : '+(sv.pseudo||'Joueur'),setPlayerPseudo),btn('Effets réduits : '+(LOW?'OUI':'NON'),()=>{LOW=!LOW;try{localStorage.setItem('falow',LOW?'1':'0')}catch(e){}settingsMenu()}),btn('Musique : '+(MU?'OUI':'NON'),()=>{MU=!MU;try{localStorage.setItem('famu',MU?'1':'0')}catch(e){}music(MU);settingsMenu()}),btn('⌨ COMMANDES',()=>ctlMenu())]));M.appendChild(row([btn('EXPORTER MA SAUVEGARDE',exportPlayerSave),btn('IMPORTER UNE SAUVEGARDE',()=>{const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{if(f.files&&f.files[0])importPlayerSave(f.files[0])};f.click()})]));M.appendChild(mk('small','Progression conservée automatiquement sur ce navigateur. Exporte régulièrement une copie de sécurité.'));M.appendChild(btn('← Retour',menu))}
function selectScreen(mode){if(mode&&mode!==cfg.mode){cfg.mode=mode;cfg.sel2=false}dlgNext=null;M.style.display='flex';M.style.background='';const m=cfg.mode,T={versus:'VERSUS LOCAL',train:'ENTRA\u00ceNEMENT'};M.innerHTML='<h1>'+(T[m]||'PERSONNAGES')+'</h1>';
const wrap=mk('div');wrap.style.cssText='display:flex;flex-wrap:wrap;gap:14px;justify-content:center;width:96%;align-items:flex-start';
const left=mk('div');left.style.cssText='display:flex;flex-wrap:wrap;gap:5px;max-width:340px;justify-content:center';
CH.forEach((c,i)=>{const b=document.createElement('button');b.style.cssText='padding:2px;width:62px;height:80px;font-size:10px;line-height:1.1;'+(cfg.p1===i?'outline:3px solid #0cf;':'')+((m==='versus'||cfg.cmp)&&cfg.p2===i?'outline:3px solid #fa4;':'');b.appendChild(portrait(i));b.appendChild(document.createElement('br'));b.appendChild(document.createTextNode(c.n));b.onmouseenter=()=>snd(900,.03,'sine',.015);b.onclick=()=>{snd(600,.06,'square',.03);if((m==='versus'||m==='online-ai'||cfg.cmp)&&cfg.sel2)cfg.p2=i;else cfg.p1=i;cfg.sf=0;selectScreen()};left.appendChild(b)});
const right=mk('div');right.style.cssText='display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:300px;max-width:540px';
if(m==='versus'||m==='online-ai'||cfg.cmp)right.appendChild(row([btn('Choix : Joueur 1',()=>{cfg.sel2=false;selectScreen()},!cfg.sel2),btn('Choix : '+(m==='versus'?'Joueur 2':'Adversaire'),()=>{cfg.sel2=true;selectScreen()},!!cfg.sel2)]));
right.appendChild(statPanel());
right.appendChild(row(AR.map((a,i)=>btn(a[0],()=>{cfg.ar=i;selectScreen()},cfg.ar===i,'background:linear-gradient(135deg,'+a[1][0]+','+a[1][1]+');color:#fff;text-shadow:0 0 4px #000;min-width:96px;height:40px;font-size:12px'+(cfg.ar===i?';outline:3px solid #fff':'')))));
if(m!=='versus'&&m!=='train')right.appendChild(row(['Facile','Normal','Difficile'].map((n,i)=>btn(n,()=>{cfg.diff=i;selectScreen()},cfg.diff===i))));
if(m==='online')right.appendChild(btn('TROUVER UN ADVERSAIRE',findOnlineOpponent,0,'font-size:20px;padding:10px 30px'));else right.appendChild(btn(m==='online-ai'?'\u25b6 LANCER LE COMBAT CLASSÉ':'\u25b6 COMBATTRE',()=>{stage=0;start()},0,'font-size:20px;padding:10px 30px'));
wrap.appendChild(left);wrap.appendChild(right);M.appendChild(wrap);M.appendChild(btn('\u2190 Retour',m==='online'?onlinePlayMenu:menu))}

if(sbClient){sbClient.auth.getSession().then(({data})=>{onlineUser=data?.session?.user||null}).catch(()=>{});sbClient.auth.onAuthStateChange((event,session)=>{onlineUser=session?.session?.user||session?.user||null;if(event==='PASSWORD_RECOVERY')passwordRecoveryMenu()})}
menu();requestAnimationFrame(loop);
</script></body></html>
